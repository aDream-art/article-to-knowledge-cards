name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  backend:
    name: backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 31 个单测不依赖 MySQL / Redis，可以直接在 CI 跑
      - name: Run tests
        run: mvn -B test
      - name: Package (skip tests)
        run: mvn -B -DskipTests package

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
